name: Validate Feed

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly: catch breakage from openwrt master / golang-package.mk churn

env:
  PKG_DIR: net/tollgate-wrt
  UPSTREAM: OpenTollGate/tollgate-module-basic-go

jobs:
  validate:
    name: Lint Makefile, verify hash & files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Makefile fields
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          [ -f "$M" ] || { echo "FAIL: $M not found"; exit 1; }
          for field in PKG_NAME PKG_VERSION PKG_RELEASE PKG_SOURCE_URL PKG_HASH \
                       PKG_LICENSE GO_PKG GO_PKG_BUILD_PKG; do
            grep -q "^${field}:" "$M" || { echo "FAIL: missing $field"; exit 1; }
          done
          grep -q 'BuildPackage' "$M" || { echo "FAIL: missing BuildPackage eval"; exit 1; }

          # Upstream policy: REPLACES is not allowed in openwrt/packages.
          grep -q 'REPLACES' "$M" && { echo "FAIL: REPLACES not allowed upstream"; exit 1; }

          echo "Makefile lint passed."

      - name: Verify PKG_HASH against the source tarball
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          EXPECTED=$(grep '^PKG_HASH:' "$M" | sed 's/^PKG_HASH:=//')
          # The upstream git tag (PKG_SOURCE_VERSION, hyphenated) drives the
          # codeload URL, NOT the apk-legal PKG_VERSION (underscored).
          PKG_SOURCE_VERSION=$(grep '^PKG_SOURCE_VERSION:' "$M" | sed 's/^PKG_SOURCE_VERSION:=//')
          [ "$EXPECTED" != "skip" ] || { echo "FAIL: PKG_HASH is 'skip'"; exit 1; }

          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_SOURCE_VERSION}"
          echo "Fetching $URL"
          # Download to a file and retry: a truncated stream must not be hashed
          # as if it were the tarball, and codeload intermittently 5xx/timeouts.
          TARBALL="$RUNNER_TEMP/tollgate-module-basic-go-$PKG_SOURCE_VERSION.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o "$TARBALL"; then break; fi
            echo "::warning::codeload fetch failed (attempt $i); retrying"
            sleep $((i * 5))
          done
          [ -s "$TARBALL" ] || { echo "FAIL: could not download $URL"; exit 1; }
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "FAIL: PKG_HASH mismatch"; exit 1; }

      - name: Extract the pinned source tarball
        # Runtime files are no longer vendored: the Makefile installs them
        # from the tarball's packaging/files/ tree, so the file-verification
        # steps below run against THIS extraction instead of ./files/.
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          # The upstream git tag (PKG_SOURCE_VERSION, hyphenated) drives the
          # codeload URL, NOT the apk-legal PKG_VERSION (underscored).
          PKG_SOURCE_VERSION=$(grep '^PKG_SOURCE_VERSION:' "$M" | sed 's/^PKG_SOURCE_VERSION:=//')
          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_SOURCE_VERSION}"
          echo "Fetching $URL"
          TARBALL="$RUNNER_TEMP/tollgate-module-basic-go-$PKG_SOURCE_VERSION.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o "$TARBALL"; then break; fi
            echo "::warning::codeload fetch failed (attempt $i); retrying"
            sleep $((i * 5))
          done
          [ -s "$TARBALL" ] || { echo "FAIL: could not download $URL"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tarball"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/tarball"
          echo "TARBALL_ROOT=$RUNNER_TEMP/tarball/tollgate-module-basic-go-$PKG_SOURCE_VERSION" >> "$GITHUB_ENV"

      - name: Verify every packaging/files/ path referenced by the Makefile exists in the tarball
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          # Guard against a regression to the vendored-files model.
          if grep -q '\./files/' "$M"; then
            echo "FAIL: Makefile references ./files/ — the vendored files/ model was removed" >&2
            exit 1
          fi
          # Pull out packaging/files/... tokens, strip a cp '/.' suffix, and
          # drop any glob (e.g. man/man8/*.8) down to its directory so the
          # existence check below can expand it.
          grep -oP 'packaging/files/\S+' "$M" \
            | sed -e 's#/\.$##' -e 's/\*.*$//' \
            | sort -u \
            | while IFS= read -r ref; do
                [ -e "$TARBALL_ROOT/$ref" ] || { echo "FAIL: Makefile references $ref but it is missing from the pinned source tarball"; exit 1; }
              done
          echo "All referenced runtime paths exist in the source tarball."

      - name: Verify the critical runtime files are present in the pinned source tarball
        run: |
          set -e
          for f in \
            packaging/files/etc/init.d/tollgate-wrt \
            packaging/files/etc/nftables.d/20-nds-enforce.nft \
            packaging/files/etc/nftables.d/30-backend-firewall.nft \
            packaging/files/etc/uci-defaults/99-tollgate-setup \
            packaging/files/etc/uci-defaults/90-tollgate-captive-portal-symlink \
            packaging/files/etc/hotplug.d/iface/95-tollgate-restart \
            packaging/files/lib/upgrade/keep.d/tollgate; do
            [ -f "$TARBALL_ROOT/$f" ] || { echo "FAIL: $f missing from the pinned source tarball"; exit 1; }
          done
          echo "Critical runtime files present in the source tarball."

  go-smoke:
    name: Go cross-compile (no SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64,                      goarm: "",  gomips: "" }
          - { goarch: arm64,                      goarm: "",  gomips: "" }
          - { goarch: mipsle,                     goarm: "",  gomips: softfloat }
    steps:
      - uses: actions/checkout@v4

      # Fetch BEFORE setup-go: the extracted tarball is what supplies the
      # go.sum files setup-go keys its module cache on. Without them
      # ("Dependencies file is not found ... Supported file pattern: go.sum")
      # every run cold-downloads every module from proxy.golang.org, which
      # intermittently aborts a zip mid-stream (see the retry note in the
      # build step below).
      - name: Download pinned upstream source
        run: |
          set -e
          # PKG_SOURCE_VERSION (hyphenated upstream tag) names the codeload
          # tarball; the apk-legal PKG_VERSION (underscored) must not appear
          # in the URL or the extract dir name.
          PKG_SOURCE_VERSION=$(grep '^PKG_SOURCE_VERSION:' "$PKG_DIR/Makefile" | sed 's/^PKG_SOURCE_VERSION:=//')
          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_SOURCE_VERSION}"
          TARBALL="$RUNNER_TEMP/tollgate-module-basic-go-$PKG_SOURCE_VERSION.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o "$TARBALL"; then break; fi
            echo "::warning::codeload fetch failed (attempt $i); retrying"
            sleep $((i * 5))
          done
          [ -s "$TARBALL" ] || { echo "FAIL: could not download $URL"; exit 1; }
          tar -xzf "$TARBALL"
          echo "TOLLGATE_SRC=$PWD/tollgate-module-basic-go-$PKG_SOURCE_VERSION/src" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          # Matches the `go 1.25.0` directive in the tarball's go.mod files, so
          # Go never has to pull a toolchain module through the same proxy.
          go-version: "1.25"
          # The feed repo itself has no go.sum - the Go modules live in the
          # upstream source extracted by the step above. Keying the module
          # cache on those go.sum files makes repeat runs download nothing.
          cache-dependency-path: "**/go.sum"

      - name: Build service + CLI for ${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          set -e
          # proxy.golang.org intermittently aborts a module zip mid-stream
          # ("stream error: stream ID 3; INTERNAL_ERROR; received from peer"),
          # which is what failed this job on run 34626562337. Every
          # network-touching go command is retried: completed downloads stay
          # in the module cache, so a retry only fetches what is missing.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "FAIL: $* - gave up after $n attempts" >&2
                return 1
              fi
              echo "::warning::$* failed (attempt $n); retrying in $((n * 10))s"
              sleep $((n * 10))
            done
          }
          # Warm the module caches first; non-fatal, since the builds below
          # retry as well (a clean cold run takes ~80 s here).
          (cd "$TOLLGATE_SRC" && retry go mod download) || \
            echo "::warning::go mod download was incomplete; the build steps retry"
          (cd "$TOLLGATE_SRC/cmd/tollgate-cli" && retry go mod download) || \
            echo "::warning::CLI go mod download was incomplete; the build steps retry"
          # Service: main module root at src/.
          (cd "$TOLLGATE_SRC" && retry go build -o /dev/null .)
          # CLI: separate module at src/cmd/tollgate-cli/.
          (cd "$TOLLGATE_SRC/cmd/tollgate-cli" && retry go build -o /dev/null .)

  build-sdk:
    name: SDK build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The authoritative proof that the package compiles inside the OpenWrt
    # build system via golang-package.mk (incl. the nested CLI module build).
    # Slow (~30-60 min/job: it bootstraps the Go toolchain). Runs on main
    # pushes, PRs, tags, weekly, and manual dispatch. The 3-target matrix
    # proves the real TollGate hardware arches alongside x86-64.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86-64,          desc: "host-runnable (amd64)" }
          - { target: mediatek-filogic, desc: "GL-MT6000 (aarch64)" }
          - { target: ramips-mt7621,    desc: "GL-MT3000 (mipsle)" }
    container:
      image: openwrt/sdk:${{ matrix.target }}-v25.12.5
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Extract the OpenWrt SDK
        # PINNED release images (openwrt/sdk:*-v25.12.5) are pre-extracted
        # (./scripts present) so setup.sh is skipped. We pin release tags —
        # NOT the moving :*-master images (rebuilt ~2026-08-14 with glibc
        # >=2.42 / iconv removal, breaking gettext-full; and snapshot SDK
        # tarballs hit mirror sha256 skew). Release images are frozen at the
        # 25.12.x toolchain (glibc < 2.42) and pre-extracted, fixing both.
        # See openwrt/docker README.
        shell: bash
        run: cd /builder && { [ -d ./scripts ] || ./setup.sh; }

      - name: Restore SDK build cache
        # Cache the built Go toolchain (golang/host) + build state so re-runs
        # skip the ~40 min Go bootstrap. run_id makes the key unique (always
        # re-saves); restore-keys prefix finds the previous run's cache for
        # this target. Note: 10 GB/repo cap — 3 arches may occasionally evict
        # (self-healing: one cold run, then re-cached).
        #
        # The key is NAMESPACED with the SDK image version (v25.12.5). This is
        # mandatory: a cache built against one toolchain (e.g. the moving
        # openwrt/sdk:*-master images, glibc >=2.42) poisons a build against a
        # different one (pinned v25.12.5, glibc <2.42). Root-caused 2026-09-08:
        # ramips-mt7621 restored a stale Aug-24 -master cache into the pinned
        # image → gettext-full [host] failed (~16 min in) with
        # "ctype.h: operator '||' has no left operand" / "#if with no expression"
        # while x86-64/mediatek (which had saved fresh post-pin caches) passed.
        # Bump this namespace tag whenever the SDK image version changes.
        uses: actions/cache@v4
        with:
          path: |
            /builder/staging_dir
            /builder/build_dir
            /builder/dl
          key: sdkbuild-${{ matrix.target }}-v25.12.5-${{ github.run_id }}
          restore-keys: |
            sdkbuild-${{ matrix.target }}-v25.12.5-

      - name: Add this feed alongside the standard feeds
        shell: bash
        run: |
          set -e
          cd /builder
          cp feeds.conf.default feeds.conf
          # src-link so the SDK builds straight from this checkout.
          echo "src-link tollgate $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update -a
          # Targeted install (not -a): -a pulls every feed package and exposes
          # current openwrt-master recursive-dependency breakage (luci,
          # strongswan, ...). golang1.26 is required because the `golang`
          # package is a dummy whose HOST_BUILD_DEPENDS is golang1.26/host
          # (the real toolchain). Bump 1.26 if GO_DEFAULT_VERSION changes.
          ./scripts/feeds install tollgate-wrt golang golang1.26 nodogsplash jq

      - name: Configure
        shell: bash
        run: |
          cd /builder
          # The SDK ships a bloated config (CONFIG_ALL/ALL_KMODS) that makes
          # builds compile every kmod and time out. Re-seed minimal: keep only
          # the target selection + our packages, build-all flags off. (Don't use
          # scripts/config -- in this image it's a directory, not the helper.)
          make defconfig
          {
            grep -E '^CONFIG_TARGET' .config 2>/dev/null
            printf '# CONFIG_ALL is not set\n# CONFIG_ALL_KMODS is not set\n# CONFIG_ALL_NONSHARED is not set\n'
            printf 'CONFIG_PACKAGE_tollgate-wrt=y\nCONFIG_PACKAGE_nodogsplash=y\nCONFIG_PACKAGE_jq=y\n'
          } > .config.min
          mv .config.min .config
          make defconfig
          echo "enabled packages (=y): $(grep -c '=y' .config)"

      - name: Build tollgate-wrt
        shell: bash
        run: |
          cd /builder
          make -j"$(nproc)" package/tollgate-wrt/compile V=s

      - name: Collect & show produced package(s)
        shell: bash
        run: |
          set -e
          cd /builder
          echo "=== produced package(s) ==="
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) -print -exec ls -lh {} \;
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          echo "=== staged for upload ==="
          ls -lh "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: tollgate-wrt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
